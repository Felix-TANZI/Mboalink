services:
  mboalink-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:13000/api/v1
      - VITE_SUPER_ADMIN_URL=http://localhost:5174
    volumes:
      - .:/app
      - /app/node_modules
    command: ["/bin/sh", "-lc", "npm install && find node_modules/.bin -type f -exec dos2unix {} \\; && npm run dev -- --host 0.0.0.0 --port 5173"]

  mboalink-super-admin:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5174:5174"
    environment:
      - VITE_API_BASE_URL=http://localhost:13000/api/v1
      - VITE_APP_SURFACE=super-admin
      - VITE_SUPER_ADMIN_URL=http://localhost:5174
    volumes:
      - .:/app
      - /app/node_modules
    command: ["/bin/sh", "-lc", "npm install && find node_modules/.bin -type f -exec dos2unix {} \\; && npm run dev -- --host 0.0.0.0 --port 5174"]
